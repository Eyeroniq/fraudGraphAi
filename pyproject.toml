[project]
name = "fraudgraph"
version = "0.1.0"
description = "Real-time fraud detection for payment transactions: graph features, uncertainty, explanations and drift monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies shared by research, API and worker. Heavy research-only
# libraries go in the `research` extra so the serving image stays slim (D5).
dependencies = [
    "fastapi>=0.115",
    "lightgbm>=4.5",
    "pandera[polars]>=0.22",
    "polars>=1.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
research = [
    "alembic>=1.13",
    "matplotlib>=3.9",
    "mlflow-skinny>=2.17",
    "sqlalchemy>=2.0",
    "torch>=2.4",
    "torch-geometric>=2.6",
]

[project.scripts]
fgx = "fraudgraph.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "poethepoet>=0.31",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fraudgraph", "services"]

# ---------------------------------------------------------------- tasks
# Cross-platform task runner (works the same on Windows, Linux and CI):
#   uv run poe <task>
[tool.poe.tasks]
setup.sequence = [
    { cmd = "uv sync --all-extras" },
    { cmd = "python scripts/install_git_hooks.py" },
]
setup.help = "Install the locked environment and the project's git pre-commit hook"

lint.sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "mypy" },
]
lint.help = "Lint, check formatting and type-check"

fmt.sequence = [
    { cmd = "ruff check --fix ." },
    { cmd = "ruff format ." },
]
fmt.help = "Auto-fix lint issues and format the code"

data.sequence = [
    { cmd = "fgx data download" },
    { cmd = "fgx data prepare" },
]
data.help = "Download PaySim (needs KAGGLE_USERNAME/KAGGLE_KEY) and build the parquet"

up.cmd = "docker compose -f deploy/docker-compose.yml up -d --build"
up.help = "Build and start the API + web page (http://localhost:8080)"

down.cmd = "docker compose -f deploy/docker-compose.yml down"
down.help = "Stop the compose stack"

test.cmd = "pytest"
test.help = "Run the test suite"

check.sequence = ["lint", "test"]
check.help = "Lint and test (what CI runs)"

# ---------------------------------------------------------------- tools
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["fraudgraph"]

[tool.mypy]
python_version = "3.12"
packages = ["fraudgraph", "services"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs external services (Redis, Postgres)",
    "model: model-quality and behaviour checks",
]

[tool.coverage.run]
source = ["fraudgraph"]
branch = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "joblib.*", "torch_geometric.*"]
ignore_missing_imports = true

# CPU-only PyTorch on Linux (CI, Docker): PyPI's default Linux wheel pulls several GB of
# CUDA libraries. PyPI's Windows/macOS wheels are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
