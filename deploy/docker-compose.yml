# Walking skeleton (Phase 2): the API plus the web page behind Caddy.
#   uv run poe up     # build and start, then open http://localhost:8080
#   uv run poe down
# The API loads the newest bundle under ../artifacts/bundles (run `fgx bundle`, or
# `fgx all --fixture --out artifacts/bundles` for a synthetic one).
name: fraudgraph

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: fraudgraph-api:dev
    volumes:
      - ../artifacts:/app/artifacts:ro
    environment:
      FG_CORS_ORIGINS: ""  # same origin through Caddy: no CORS needed (D9)
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: fraudgraph-web:dev
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
