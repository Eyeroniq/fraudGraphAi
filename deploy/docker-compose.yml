# Backend stack (Phase 7): API + Redis (feature state) + Postgres (decision log), the
# worker (monitors, daily retrain, demo replayer) and the web page behind Caddy.
#   cp deploy/.env.example deploy/.env    # then fill in the keys (`fgx api-key`)
#   uv run poe up     # build and start, then open http://localhost:8080
#   uv run poe down
# The API loads the newest bundle under ../artifacts/bundles (run `fgx bundle`, or
# `fgx all --fixture --out artifacts/bundles` for a synthetic one). The worker writes
# challenger bundles next to it and Evidently-free drift windows into Postgres; start
# the replayer with POST /api/v1/sim/start (admin key). Metrics: http://api:8000/metrics
# on the internal network only (Caddy does not route it).
name: fraudgraph

x-api-env: &api-env
  FG_API__DATABASE_URL: postgresql+psycopg://fraudgraph:${POSTGRES_PASSWORD:?set it in deploy/.env}@postgres:5432/fraudgraph
  FG_API__REDIS_URL: redis://redis:6379/0
  FG_API__API_KEYS: ${FG_API__API_KEYS:?set it in deploy/.env}
  FG_API__CORS_ORIGINS: ""  # same origin through Caddy: no CORS needed (D9)
  # The demo replayer posts 1,000-event batches; external clients keep the default.
  FG_API__RATE_LIMIT_BATCH: "600/minute"
  FG_API__RATE_LIMIT_SCORE: ${FG_API__RATE_LIMIT_SCORE:-1200/minute}

services:
  redis:
    image: redis:7.4-alpine
    # Feature state is rebuilt by replaying the stream, so no persistence; a memory cap
    # with LRU eviction keeps idle accounts from growing it without bound.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudgraph
      POSTGRES_USER: fraudgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudgraph -d fraudgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: fraudgraph-api:dev
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: fraudgraph-api:dev
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    volumes:
      - ../${FG_ARTIFACTS:-artifacts}:/app/artifacts:ro
      - ../reports:/app/reports:ro
    environment: *api-env
    command: ["sh", "-c", "uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers ${FG_API_WORKERS:-1}"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  worker:
    image: fraudgraph-worker:dev
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      args:
        EXTRAS: "--extra worker"
    command: ["python", "-m", "services.worker.main"]
    healthcheck:
      disable: true  # no HTTP server; the image's check is the API's
    volumes:
      - ../${FG_ARTIFACTS:-artifacts}:/app/artifacts  # writes challenger bundles
      - ../reports:/app/reports
      - ../data:/app/data:ro  # events for the demo replayer
    environment:
      <<: *api-env
      FG_WORKER__API_URL: http://api:8000
      FG_WORKER__WRITE_KEY: ${FG_WORKER__WRITE_KEY:?set it in deploy/.env}
      FG_WORKER__ADMIN_KEY: ${FG_WORKER__ADMIN_KEY:?set it in deploy/.env}
      FG_WORKER__EVENTS_PATH: /app/data/${FG_EVENTS:-processed/paysim.parquet}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: fraudgraph-web:dev
    environment:
      FG_WEB_API_KEY: ${FG_WEB_API_KEY:?set it in deploy/.env}
    ports:
      - "${FG_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
