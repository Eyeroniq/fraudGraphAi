name: release

# On a version tag (v*): build the api, worker and web images, push them to GHCR with the
# version and `latest` tags, and publish a GitHub release with the model card (task 9.3).
# Deploy with FG_VERSION=<tag> (deploy/README.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
            extras: ""
          - name: worker
            dockerfile: docker/api.Dockerfile
            extras: --extra worker
          - name: web
            dockerfile: docker/web.Dockerfile
            extras: ""
    steps:
      - uses: actions/checkout@v4
      - name: image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fraudgraph-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: EXTRAS=${{ matrix.extras }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release with the model card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" docs/model_card.md \
            --title "FraudGraph $GITHUB_REF_NAME" \
            --notes "Images: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fraudgraph-{api,worker,web}:$GITHUB_REF_NAME. Deploy: deploy/README.md."
