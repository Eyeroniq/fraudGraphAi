name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date with pyproject.toml
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (ruff, format, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run poe lint
      - name: file hygiene (pre-commit, excluding lint hooks run above)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux matches the Docker images; Windows is the main dev platform.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Unit tests run on the synthetic fixture only; CI never needs the real dataset (D10).
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker-smoke:
    name: docker smoke (api image)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # A bundle from the synthetic data: CI never needs the real dataset (D10).
      - run: uv run fgx all --fixture --out artifacts/bundles
      - run: docker build -f docker/api.Dockerfile -t fraudgraph-api:ci .
      - run: >
          docker run -d --name api -p 8000:8000
          -v "$PWD/artifacts:/app/artifacts:ro" fraudgraph-api:ci
      - run: uv run python scripts/smoke_api.py http://localhost:8000
      - if: failure()
        run: docker logs api
