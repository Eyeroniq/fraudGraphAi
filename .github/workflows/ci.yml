name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date with pyproject.toml
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (ruff, format, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run poe lint
      - name: file hygiene (pre-commit, excluding lint hooks run above)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux matches the Docker images; Windows is the main dev platform.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Unit tests run on the synthetic fixture only; CI never needs the real dataset (D10).
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  integration:
    name: integration (redis, postgres)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg
          POSTGRES_DB: fg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fg" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+psycopg://fg:fg@localhost:5432/fg
      REQUIRE_INTEGRATION: "1" # a missing service fails instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Redis parity with the in-memory store (7.1) and the Alembic schema on Postgres (7.2).
      - run: uv run pytest -m integration

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker-smoke:
    name: docker smoke (api image, redis, postgres)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg
          POSTGRES_DB: fg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fg" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # A bundle from the synthetic data: CI never needs the real dataset (D10).
      - run: uv run fgx all --fixture --out artifacts/bundles
      - run: docker build -f docker/api.Dockerfile -t fraudgraph-api:ci .
      - name: api key for the smoke test
        run: |
          out=$(uv run fgx api-key --scope write)
          key=$(echo "$out" | sed -n 's/^key: *//p')
          echo "::add-mask::$key"
          echo "SMOKE_API_KEY=$key" >> "$GITHUB_ENV"
          echo "FG_API__API_KEYS=$(echo "$out" | sed -n 's/^entry: *//p')" >> "$GITHUB_ENV"
      - name: migrate and start the api against redis and postgres
        env:
          FG_API__DATABASE_URL: postgresql+psycopg://fg:fg@localhost:5432/fg
          FG_API__REDIS_URL: redis://localhost:6379/0
        run: |
          docker run --rm --network host -e FG_API__DATABASE_URL fraudgraph-api:ci alembic upgrade head
          docker run -d --name api --network host             -e FG_API__DATABASE_URL -e FG_API__REDIS_URL -e FG_API__API_KEYS             -v "$PWD/artifacts:/app/artifacts:ro" fraudgraph-api:ci
      - run: uv run python scripts/smoke_api.py http://localhost:8000
      - if: failure()
        run: docker logs api
