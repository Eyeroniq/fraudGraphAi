name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly: stack e2e on main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date with pyproject.toml
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (ruff, format, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run poe lint
      - name: file hygiene (pre-commit, excluding lint hooks run above)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux matches the Docker images and owns the coverage gate (>= 80 % of
        # fraudgraph/); Windows, the main dev platform, skips the slower model tests.
        include:
          - os: ubuntu-latest
            pytest: --cov --cov-report=term-missing:skip-covered --cov-fail-under=80
          - os: windows-latest
            pytest: -m "not model"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Unit tests run on the synthetic fixture only; CI never needs the real dataset (D10).
      - run: uv run pytest ${{ matrix.pytest }}

  model-validation:
    name: model validation (gates, behaviour, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # 9.1: data integrity, train/test validation and model evaluation; exits 1 on a failed condition.
      - run: uv run fgx validate --fixture --out reports/validation/fixture
      # 9.2: invariance, directional, minimum functionality, floors, conformal coverage.
      - run: uv run pytest tests/model/test_behaviour.py
      - run: uv run fgx all --fixture --out artifacts/bundles
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            reports/validation
            artifacts/bundles/*/manifest.json
          retention-days: 30

  integration:
    name: integration (redis, postgres)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg
          POSTGRES_DB: fg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fg" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+psycopg://fg:fg@localhost:5432/fg
      REQUIRE_INTEGRATION: "1" # a missing service fails instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Redis parity with the in-memory store (7.1) and the Alembic schema on Postgres (7.2).
      - run: uv run pytest -m integration

  web:
    name: web (contract, types, unit, e2e + a11y, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The console's types come from the API's schema: regenerate both, fail on drift.
      - name: API contract is up to date
        run: |
          uv run python ../scripts/export_openapi.py
          npm run gen:api
          git diff --exit-code -- openapi.json lib/schema.d.ts
      - run: npm run lint
      - run: npm test
      - name: e2e and accessibility (demo data, no API)
        run: |
          NEXT_PUBLIC_MOCK=1 npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
      - name: production build
        run: npm run build

  rust-client:
    name: rust client (J4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  docker-smoke:
    name: docker smoke (compose stack)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # api, worker and web images, Redis, Postgres, migrations, Caddy: the whole stack.
      - run: deploy/ci-stack.sh
      # Through Caddy as the browser: page, ready, metrics hidden, score, case, resolve, label.
      - run: uv run python scripts/smoke_stack.py http://localhost:8080
      - name: metrics on the internal port
        run: curl -fsS http://localhost:8000/metrics | grep -q fraudgraph_decisions_total
      - name: worker is running
        run: docker compose -f deploy/docker-compose.yml logs worker | grep -q "worker started"
      # Reported, not gating: the target (p95 < 50 ms at 200 rps on 2 workers, 7.6) is for
      # the deployment host; a shared CI runner also runs the load generator.
      - name: load test (200 rps, 30 s)
        continue-on-error: true
        run: |
          uv run python scripts/load_test.py --base http://localhost:8000 \
            --key "$STACK_WRITE_KEY" --rps 200 --seconds 30 --p95-ms 50 | tee load_test.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat load_test.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: production overlay is valid
        env:
          FG_VERSION: ci
          FG_DOMAIN: fraudgraph.example
          FG_ACME_EMAIL: ops@fraudgraph.example
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200

  e2e:
    name: e2e (Playwright against the stack)
    runs-on: ubuntu-latest
    needs: [docker-smoke, web]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-extras
      - run: deploy/ci-stack.sh
      - name: console flow on the live stack
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.stack.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-e2e-traces
          path: web/test-results
          retention-days: 7
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200
