name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date with pyproject.toml
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (ruff, format, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run poe lint
      - name: file hygiene (pre-commit, excluding lint hooks run above)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux matches the Docker images; Windows is the main dev platform.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Unit tests run on the synthetic fixture only; CI never needs the real dataset (D10).
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered

  integration:
    name: integration (redis, postgres)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg
          POSTGRES_DB: fg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fg" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+psycopg://fg:fg@localhost:5432/fg
      REQUIRE_INTEGRATION: "1" # a missing service fails instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Redis parity with the in-memory store (7.1) and the Alembic schema on Postgres (7.2).
      - run: uv run pytest -m integration

  web:
    name: web (contract, types, unit, e2e + a11y, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The console's types come from the API's schema: regenerate both, fail on drift.
      - name: API contract is up to date
        run: |
          uv run python ../scripts/export_openapi.py
          npm run gen:api
          git diff --exit-code -- openapi.json lib/schema.d.ts
      - run: npm run lint
      - run: npm test
      - name: e2e and accessibility (demo data, no API)
        run: |
          NEXT_PUBLIC_MOCK=1 npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
      - name: production build
        run: npm run build

  rust-client:
    name: rust client (J4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  docker-smoke:
    name: docker smoke (api image, redis, postgres)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg
          POSTGRES_DB: fg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fg" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # A bundle from the synthetic data: CI never needs the real dataset (D10).
      - run: uv run fgx all --fixture --out artifacts/bundles
      - run: docker build -f docker/api.Dockerfile -t fraudgraph-api:ci .
      - name: api key for the smoke test
        run: |
          out=$(uv run fgx api-key --scope write)
          key=$(echo "$out" | sed -n 's/^key: *//p')
          echo "::add-mask::$key"
          echo "SMOKE_API_KEY=$key" >> "$GITHUB_ENV"
          echo "FG_API__API_KEYS=$(echo "$out" | sed -n 's/^entry: *//p')" >> "$GITHUB_ENV"
      - name: migrate and start the api (2 workers) against redis and postgres
        env:
          FG_API__DATABASE_URL: postgresql+psycopg://fg:fg@localhost:5432/fg
          FG_API__REDIS_URL: redis://localhost:6379/0
          FG_API__RATE_LIMIT_SCORE: 1000000/minute  # the load test below
        run: |
          docker run --rm --network host -e FG_API__DATABASE_URL fraudgraph-api:ci alembic upgrade head
          docker run -d --name api --network host -e FG_API__DATABASE_URL -e FG_API__REDIS_URL \
            -e FG_API__API_KEYS -e FG_API__RATE_LIMIT_SCORE \
            -v "$PWD/artifacts:/app/artifacts:ro" fraudgraph-api:ci \
            uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 2
      - run: uv run python scripts/smoke_api.py http://localhost:8000
      - name: metrics endpoint
        run: curl -fsS http://localhost:8000/metrics | grep -q fraudgraph_decisions_total
      - name: one worker tick against postgres (monitors, retrain, judge)
        run: |
          docker build -f docker/api.Dockerfile --build-arg EXTRAS="--extra worker" -t fraudgraph-worker:ci .
          docker run --rm --network host \
            -e FG_API__DATABASE_URL=postgresql+psycopg://fg:fg@localhost:5432/fg \
            -v "$PWD/artifacts:/app/artifacts" fraudgraph-worker:ci \
            python -m services.worker.main --once
      # Reported, not gating: the target (p95 < 50 ms at 200 rps on 2 workers, 7.6) is for
      # the deployment host; a shared CI runner also runs the load generator.
      - name: load test (200 rps, 30 s)
        continue-on-error: true
        run: |
          uv run python scripts/load_test.py --base http://localhost:8000 \
            --key "$SMOKE_API_KEY" --rps 200 --seconds 30 --p95-ms 50 | tee load_test.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat load_test.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker logs api
