# Base configuration. Every value can be overridden by an environment variable:
#   FG_<FIELD>, with "__" between nested levels, e.g. FG_PATHS__DATA_DIR=/mnt/big/data
# A different YAML file can be used with FG_CONFIG=path/to/file.yaml.

seed: 42

# PaySim: 1 step = 1 hour. Labels become usable for features L steps after the event (D4).
label_delay_steps: 24

paths:
  data_dir: data
  artifacts_dir: artifacts
  reports_dir: reports

data:
  kaggle_dataset: ealaxi/paysim1
  csv_name: PS_20174392719_1491204439457_log.csv
  # sha256 of the raw CSV (Kaggle ealaxi/paysim1, 493,534,783 bytes), pinned 2026-10-21.
  raw_sha256: 16910f90577b0d981bf8ff289714510bb89bc71bff7d3f220f024e287e4eea6b

# Time-based splits (task 1.1). Shares are of TRANSFER + CASH_OUT rows in steps
# 1..dense_last_step; later steps are the late-period test. The embargo between
# training and calibration is label_delay_steps.
splits:
  dense_last_step: 408
  train_share: 0.70
  calib_share: 0.15
  train_val_share: 0.15
  calib_a_share: 0.5
  min_test_days: 10

# Cost model (A6), in PaySim currency units (median legit transfer ~171k).
# Review ~1 % and friction ~12 % of that; see docs/policy.md for why not 5 / 50.
costs:
  c_review: 2000.0
  c_friction: 20000.0
  catch_rate: 0.9
  c_block: 0.0

# Model the policy, bundle and API use.
champion: lgbm

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db
  experiment: fraudgraph
