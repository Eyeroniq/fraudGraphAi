[package]
name = "fraudgraph-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Blocking client for the FraudGraph scoring API, with a pre-authorisation fraud-risk (FRM) hook"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
mockito = "1"
